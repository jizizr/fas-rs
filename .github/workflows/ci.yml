name: ci-build
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: "30.0.16248370"
jobs:
  build:
    name: ${{ matrix.profile }}-build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: release
            args: "-r"
          - profile: debug
            args: ""
    steps:
      - uses: actions/checkout@v4
      - name: Setup NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$ndk/toolchains/llvm/prebuilt/linux-x86_64/lib" >> "$GITHUB_ENV"
      - name: Setup Rust toolchain
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src --target aarch64-linux-android
          rustup default nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.profile }}-ndk-${{ env.NDK_VERSION }}
      - name: Install BPF linker
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/bpf-linker.tar.zst" https://github.com/aya-rs/bpf-linker/releases/download/v0.12.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          echo "6789717c8cb6a2a5d920f3b6bfac2bd7efc00f6228ecd149108a99699a75c679  $RUNNER_TEMP/bpf-linker.tar.zst" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/bpf-linker"
          tar --zstd -xf "$RUNNER_TEMP/bpf-linker.tar.zst" -C "$RUNNER_TEMP/bpf-linker"
          echo "$RUNNER_TEMP/bpf-linker" >> "$GITHUB_PATH"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: webui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml
      - name: Other dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
      - name: Test page size handling
        if: matrix.profile == 'debug'
        run: cargo test --locked -p frame-analyzer --lib
      - name: Build
        run: cargo xtask build ${{ matrix.args }} -v
      - name: Check 16 KiB ELF alignment
        run: python3 .github/scripts/check-elf-alignment.py "target/aarch64-linux-android/${{ matrix.profile }}/fas-rs"
      - name: Prepare artifacts
        run: |
          mkdir -p "output/artifact/${{ matrix.profile }}"
          unzip "output/fas-rs(${{ matrix.profile }}).zip" -d "output/artifact/${{ matrix.profile }}"
      - name: Upload ${{ matrix.profile }} version
        uses: actions/upload-artifact@v4
        with:
          name: fas-rs(${{ matrix.profile }})
          compression-level: 9
          if-no-files-found: error
          path: output/artifact/${{ matrix.profile }}

  push_to_ci_group:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Push to CI Group
    env:
      GROUP_DEBUG_ID: ${{ secrets.TELEGRAM_TO }}
      BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
    needs:
      - build
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package Artifacts
        run: |
          cd "${{ github.workspace }}/artifacts/fas-rs(debug)"
          zip -9 -rq "../fas-rs(debug)" .
          cd "${{ github.workspace }}/artifacts/fas-rs(release)"
          zip -9 -rq "../fas-rs(release)" .
      - name: Post to Debug Group
        if: env.BOT_TOKEN != '' && env.GROUP_DEBUG_ID != ''
        shell: bash
        env:
          GROUP_DEBUG_ID: ${{ secrets.TELEGRAM_TO }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          THREAD_ID: ${{ secrets.THREAD_ID }}
          COMMIT_MESSAGE: |+
            New push to GitHub
            ```
            ${{ github.event.head_commit.message }}
            ```by `${{ github.event.head_commit.author.name }}`
            See commit detail [here](${{ github.event.head_commit.url }})
        run: |
          ESCAPED=$(python3 -c 'import json,os,urllib.parse; print(urllib.parse.quote(json.dumps(os.environ["COMMIT_MESSAGE"])))')
          cd ${{ github.workspace }}
          echo $COMMIT_MESSAGE_FIXED
          curl -v "https://api.telegram.org/bot${BOT_TOKEN}/sendMediaGroup?chat_id=${GROUP_DEBUG_ID}&message_thread_id=${THREAD_ID}&media=%5B%7B%22type%22:%22document%22,%20%22media%22:%22attach://debug_zip%22,%22parse_mode%22:%22MarkdownV2%22,%22caption%22:\"\"%7D,%7B%22type%22:%22document%22,%20%22media%22:%22attach://release_zip%22,%22parse_mode%22:%22MarkdownV2%22,%22caption%22:${ESCAPED}%7D%5D" -F debug_zip="@artifacts/fas-rs(debug).zip" -F release_zip="@artifacts/fas-rs(release).zip"
